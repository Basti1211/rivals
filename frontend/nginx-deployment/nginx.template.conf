server {
    listen 80;
    server_name localhost;

    # Serve the static files from the Vite build
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Error page handling
    error_page 404 /index.html;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # API reverse proxy:

    # Single block handles /api and /api/* and proxies it to back end
    location ^~ /api {
        # strip the /api prefix (works for /api and /api/anything)
        rewrite ^/api/?(.*)$ /$1 break;

        # forward to backend with the stripped URI
        proxy_pass http://${BACKEND_HOST_NAME}:${BACKEND_PORT};

        # keep origin Host like Vite's changeOrigin:false
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # (optional but nice) tell upstream the external mount point
        proxy_set_header X-Forwarded-Prefix /api;

        # websockets/keep-alive
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        client_max_body_size 0;
    }
}
